<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="EntryQ – Fast gate security & visitor management for societies" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>EntryQ – Gate</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="app">
    <section id="view-boot" class="view active">
      <div class="boot-card">
        <div class="logo">Entry<span>Q</span></div>
        <p class="tagline">Society Gate Security</p>
        <div id="society-list" class="society-list"></div>
        <button id="btn-new-society" class="btn btn-primary">+ New Society</button>
      </div>
    </section>

    <section id="view-role" class="view">
      <header class="topbar">
        <button class="btn-icon" id="btn-back-boot" aria-label="Back">←</button>
        <h1 id="society-name-label">Society</h1>
      </header>
      <div class="role-grid">
        <button class="role-card" data-role="guard">
          <span class="role-icon">🛡️</span>
          <span class="role-title">Watchmen</span>
          <span class="role-desc">Guard kiosk – entry & validation</span>
        </button>
        <button class="role-card" data-role="resident">
          <span class="role-icon">🏠</span>
          <span class="role-title">Owner / Tenant</span>
          <span class="role-desc">Create guest passes</span>
        </button>
        <button class="role-card" data-role="admin">
          <span class="role-icon">⚙️</span>
          <span class="role-title">Society Admin</span>
          <span class="role-desc">People, logs & setup</span>
        </button>
      </div>
    </section>

    <section id="view-guard" class="view">
      <header class="topbar kiosk">
        <div class="kiosk-brand">EntryQ · <span id="guard-society-name"></span></div>
        <div class="kiosk-clock" id="kiosk-clock">--:--</div>
        <button class="btn-icon" id="btn-guard-exit" title="Exit">✕</button>
      </header>
      <nav class="kiosk-tabs">
        <button class="tab active" data-tab="validate">Validate</button>
        <button class="tab" data-tab="walkin">Walk-in</button>
        <button class="tab" data-tab="logs">Today</button>
      </nav>
      <div id="guard-validate" class="tab-panel active">
        <div class="kiosk-panel">
          <h2>Scan / Enter Code</h2>
          <input id="pass-input" class="input-xl" type="text" inputmode="numeric" placeholder="OTP or QR code" autocomplete="off" autofocus />
          <div class="btn-row">
            <button id="btn-validate" class="btn btn-success btn-xl">Validate</button>
            <button id="btn-clear-pass" class="btn btn-ghost">Clear</button>
          </div>
          <div id="validate-result" class="result-box hidden"></div>
        </div>
      </div>
      <div id="guard-walkin" class="tab-panel">
        <div class="kiosk-panel">
          <h2>Walk-in / Delivery</h2>
          <form id="walkin-form">
            <label>Visitor Name *</label>
            <input name="name" class="input" required placeholder="Full name" />
            <label>Phone</label>
            <input name="phone" class="input" type="tel" placeholder="10-digit mobile" />
            <label>Purpose</label>
            <select name="purpose" class="input">
              <option>Guest</option>
              <option>Delivery</option>
              <option>Cab / Taxi</option>
              <option>Service</option>
              <option>Other</option>
            </select>
            <label>Unit / Flat *</label>
            <input name="unit" class="input" required placeholder="e.g. A-1204" />
            <label>Photo (optional)</label>
            <input name="photo" type="file" accept="image/*" capture="environment" class="input" />
            <div class="btn-row">
              <button type="submit" class="btn btn-primary btn-xl">Request Approval</button>
            </div>
          </form>
          <div id="walkin-result" class="result-box hidden"></div>
        </div>
      </div>
      <div id="guard-logs" class="tab-panel">
        <div class="kiosk-panel">
          <h2>Today’s Entries</h2>
          <div id="today-logs" class="log-list"></div>
        </div>
      </div>
    </section>

    <section id="view-resident" class="view">
      <header class="topbar">
        <button class="btn-icon" id="btn-res-back">←</button>
        <h1>My Passes</h1>
        <button class="btn-icon" id="btn-res-exit">✕</button>
      </header>
      <div class="content">
        <button id="btn-new-invite" class="btn btn-primary btn-block">+ Create Guest Pass</button>
        <div id="my-invites" class="invite-list"></div>
      </div>
      <div id="modal-invite" class="modal hidden">
        <div class="modal-card">
          <h2>New Guest Pass</h2>
          <form id="invite-form">
            <label>Guest Name *</label>
            <input name="guestName" class="input" required />
            <label>Phone</label>
            <input name="guestPhone" class="input" type="tel" />
            <label>Valid From</label>
            <input name="validFrom" class="input" type="datetime-local" required />
            <label>Valid Until</label>
            <input name="validUntil" class="input" type="datetime-local" required />
            <label>Max Entries</label>
            <input name="maxEntries" class="input" type="number" min="1" value="1" />
            <label>Unit</label>
            <input name="unit" class="input" placeholder="Your flat" required />
            <div class="btn-row">
              <button type="button" class="btn btn-ghost" id="btn-cancel-invite">Cancel</button>
              <button type="submit" class="btn btn-primary">Generate Pass</button>
            </div>
          </form>
        </div>
      </div>
    </section>

    <section id="view-admin" class="view">
      <header class="topbar">
        <button class="btn-icon" id="btn-admin-back">←</button>
        <h1>Society Admin</h1>
        <button class="btn-icon" id="btn-admin-exit">✕</button>
      </header>
      <nav class="admin-tabs kiosk-tabs">
        <button class="tab active" data-tab="people">People</button>
        <button class="tab" data-tab="logs">Logs</button>
        <button class="tab" data-tab="invites">Invites</button>
        <button class="tab" data-tab="tools">Tools</button>
      </nav>
      <div class="content">
        <div class="admin-stats" id="admin-stats"></div>
        <div id="admin-people" class="tab-panel active">
          <button id="btn-add-person" class="btn btn-primary btn-block">+ Add Person</button>
          <div id="people-list" class="people-list"></div>
        </div>
        <div id="admin-logs" class="tab-panel">
          <div id="admin-logs-list" class="log-list"></div>
        </div>
        <div id="admin-invites" class="tab-panel">
          <div id="admin-invites-list" class="invite-list"></div>
        </div>
        <div id="admin-tools" class="tab-panel">
          <button id="btn-export" class="btn btn-ghost btn-block">Export JSON (backup)</button>
          <button id="btn-clear-data" class="btn btn-danger btn-block">Clear Society Data</button>
        </div>
      </div>
      <div id="modal-person" class="modal hidden">
        <div class="modal-card">
          <h2 id="person-modal-title">Add Person</h2>
          <form id="person-form">
            <label>Name *</label>
            <input name="name" class="input" required placeholder="Full name" />
            <label>Phone</label>
            <input name="phone" class="input" type="tel" placeholder="10-digit mobile" />
            <label>Unit / Flat</label>
            <input name="unit" class="input" placeholder="e.g. A-1204" />
            <label>Role *</label>
            <select name="role" class="input" required>
              <option value="society_admin">Society Admin</option>
              <option value="owner">Owner</option>
              <option value="tenant">Tenant</option>
              <option value="watchmen">Watchmen</option>
            </select>
            <div class="btn-row">
              <button type="button" class="btn btn-ghost" id="btn-cancel-person">Cancel</button>
              <button type="submit" class="btn btn-primary">Save</button>
            </div>
          </form>
        </div>
      </div>
    </section>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/boot.js"></script>
  <script src="js/guard.js"></script>
  <script src="js/resident.js"></script>
  <script src="js/people.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(console.warn);
    }
  </script>
</body>
</html>
